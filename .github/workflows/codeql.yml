name: CodeQL

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: CodeQL (Swift)
    # Traced Swift extraction is unavailable on macOS 27 / Xcode 27; pin macos-26.
    runs-on: macos-26
    timeout-minutes: 30 # hard cap; -O traced build on push/nightly, queue typically 2–5 s
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Build for CodeQL
        run: |
          export VERSION=v0.0.0
          bash scripts/build.sh

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
