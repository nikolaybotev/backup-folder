name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: CodeQL (Swift)
    # Traced Swift extraction is unavailable on macOS 27 / Xcode 27; pin macos-26.
    runs-on: macos-26
    timeout-minutes: 15 # hard cap; -O traced build ~12–14 min, queue typically 2–5 s
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Build for CodeQL
        run: |
          bash tests/build-backup-folder.sh "$RUNNER_TEMP/backup-folder"
          swiftc -O -o "$RUNNER_TEMP/drop-box-watcher" \
            drop-box-watcher/Config.swift \
            drop-box-watcher/Readiness.swift \
            drop-box-watcher/Log.swift \
            drop-box-watcher/WebhookHTTP.swift \
            drop-box-watcher/WebhookNotifier.swift \
            drop-box-watcher/Watcher.swift \
            drop-box-watcher/main.swift

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
