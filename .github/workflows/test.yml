name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Build and APFS smoke test
        run: bash tests/macos-smoke.sh
      - name: Drop Box watcher macOS smoke
        run: bash tests/macos-watcher.sh
      - name: Darwin-free unit tests
        run: bash tests/linux-unit.sh
      - name: Secret and template scan
        run: bash tests/no-secrets.sh
      - name: Release workflow static check
        run: bash tests/release-workflow.sh
      - name: Install Roger tools script test
        run: bash tests/install-roger-tools-test.sh
      - name: Ensure backup dirs script test
        run: bash tests/ensure-backup-dirs-test.sh
      - name: Setup and restore docs check
        run: bash tests/setup-docs.sh

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install Swift toolchain
        run: |
          set -euo pipefail
          if [ ! -x "${HOME}/.local/bin/mise" ]; then
            curl -fsSL https://mise.run/bash | sh
          fi
          export PATH="${HOME}/.local/bin:${PATH}"
          eval "$(mise activate bash)"
          if ! ldconfig -p 2>/dev/null | grep -q 'libncurses\.so\.6'; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libncurses6
          fi
          mise trust --yes
          mise install
          mise reshim
          swiftc --version
      - name: Darwin-free unit tests
        run: bash tests/linux-unit.sh
      - name: Retention unit tests
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          eval "$(mise activate bash)"
          swiftc -O -o retention-tests Retention.swift tests/retention-tests.swift
          ./retention-tests
      - name: Path containment unit tests
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          eval "$(mise activate bash)"
          swiftc -o path-tests PathCheck.swift tests/path-tests.swift
          ./path-tests
