name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 5 # hard cap; ~0.3–0.8 min run, queue typically 2–5 s
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Build entry and product binaries
        run: |
          set -euo pipefail
          export VERSION=v0.0.0
          bash scripts/build.sh
          codesign -dv ./backup-folder 2>&1 | grep -q 'Signature=adhoc'
          if [[ -x ./drop-box-watcher/drop-box-watcher ]]; then
            watcher_bin=./drop-box-watcher/drop-box-watcher
          else
            watcher_bin=./drop-box-watcher
          fi
          codesign -dv "$watcher_bin" 2>&1 | grep -q 'Signature=adhoc'
          export VERSION=v9.9.9
          ts_build="$(date -u +%Y-%m-%dT%H:%MZ)"
          bash scripts/build.sh
          head_sha="$(git rev-parse HEAD)"
          short_sha="${head_sha:0:7}"
          ts_check="$(date -u +%Y-%m-%dT%H:%MZ)"
          assert_built_minute() {
            local label="$1"
            local got="$2"
            local product="$3"
            local version="$4"
            local sha_display="$5"
            local want_build="${product} ${version} (${sha_display}, built ${ts_build})"
            local want_check="${product} ${version} (${sha_display}, built ${ts_check})"
            if [[ "$got" == "$want_build" || "$got" == "$want_check" ]]; then
              return 0
            fi
            echo "${label} mismatch" >&2
            echo "  want (build minute): $want_build" >&2
            echo "  want (check minute): $want_check" >&2
            echo "  got:                 $got" >&2
            exit 1
          }
          assert_built_minute "backup-folder --version" "$(./backup-folder --version)" backup-folder v9.9.9 "$short_sha"
          assert_built_minute "backup-folder --version --verbose" "$(./backup-folder --version --verbose)" backup-folder v9.9.9 "$head_sha"
          assert_built_minute "drop-box-watcher --version" "$("$watcher_bin" --version)" drop-box-watcher v9.9.9 "$short_sha"
          assert_built_minute "drop-box-watcher --version --verbose" "$("$watcher_bin" --version --verbose)" drop-box-watcher v9.9.9 "$head_sha"
      - name: Build entry static check
        run: bash tests/build-entry-test.sh
      - name: Build and APFS smoke test
        run: bash tests/macos-smoke.sh
      - name: Drop Box watcher macOS smoke
        run: bash tests/macos-watcher.sh
      - name: Darwin-free unit tests
        run: bash tests/linux-unit.sh
      - name: Secret and template scan
        run: bash tests/no-secrets.sh
      - name: Release workflow static check
        run: bash tests/release-workflow.sh
      - name: Release version static check
        run: bash tests/release-version-test.sh
      - name: Install tools script test
        run: bash tests/install-tools-test.sh
      - name: Ensure backup dirs script test
        run: bash tests/ensure-backup-dirs-test.sh
      - name: Setup and restore docs check
        run: bash tests/setup-docs.sh

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # hard cap; ~1–1.5 min run, queue typically 2–5 s
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Build entry static check
        run: bash tests/build-entry-test.sh
      - name: Release version static check
        run: bash tests/release-version-test.sh
      - name: Release workflow static check
        run: bash tests/release-workflow.sh
      - name: Install Swift toolchain
        run: |
          set -euo pipefail
          if [ ! -x "${HOME}/.local/bin/mise" ]; then
            curl -fsSL https://mise.run/bash | sh
          fi
          export PATH="${HOME}/.local/bin:${PATH}"
          eval "$(mise activate bash)"
          if ! ldconfig -p 2>/dev/null | grep -q 'libncurses\.so\.6'; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libncurses6
          fi
          mise trust --yes
          mise install
          mise reshim
          swiftc --version
      - name: Darwin-free unit tests
        run: bash tests/linux-unit.sh
      - name: Retention unit tests
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          eval "$(mise activate bash)"
          swiftc -O -o retention-tests Sources/backup-folder/Retention.swift tests/retention-tests.swift
          ./retention-tests
      - name: Path containment unit tests
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          eval "$(mise activate bash)"
          swiftc -o path-tests Sources/backup-folder/PathCheck.swift tests/path-tests.swift
          ./path-tests
