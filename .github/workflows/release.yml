name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Build backup-folder
        run: bash tests/build-backup-folder.sh
      - name: Build drop-box-watcher
        run: |
          swiftc -O -o drop-box-watcher \
            drop-box-watcher/Config.swift \
            drop-box-watcher/Readiness.swift \
            drop-box-watcher/Log.swift \
            drop-box-watcher/WebhookHTTP.swift \
            drop-box-watcher/WebhookNotifier.swift \
            drop-box-watcher/Watcher.swift \
            drop-box-watcher/main.swift
      - name: Attest backup-folder
        uses: actions/attest@v4
        with:
          subject-path: backup-folder
      - name: Attest drop-box-watcher
        uses: actions/attest@v4
        with:
          subject-path: drop-box-watcher
      - name: Verify backup-folder attestation
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh attestation verify backup-folder \
              --repo nikolaybotev/backup-folder \
              --signer-workflow nikolaybotev/backup-folder/.github/workflows/release.yml \
              --deny-self-hosted-runners; then
              exit 0
            fi
            sleep 15
          done
          echo "gh attestation verify failed for backup-folder after retries" >&2
          exit 1
      - name: Verify drop-box-watcher attestation
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh attestation verify drop-box-watcher \
              --repo nikolaybotev/backup-folder \
              --signer-workflow nikolaybotev/backup-folder/.github/workflows/release.yml \
              --deny-self-hosted-runners; then
              exit 0
            fi
            sleep 15
          done
          echo "gh attestation verify failed for drop-box-watcher after retries" >&2
          exit 1
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backup-folder
            drop-box-watcher
          generate_release_notes: true
