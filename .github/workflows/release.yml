name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Build backup-folder
        run: swiftc -O -o backup-folder backup-folder.swift
      - name: Build drop-box-watcher
        if: hashFiles('drop-box-watcher.swift') != ''
        run: swiftc -O -o drop-box-watcher drop-box-watcher.swift
      - name: Attest backup-folder
        uses: actions/attest@v4
        with:
          subject-path: backup-folder
      - name: Attest drop-box-watcher
        if: hashFiles('drop-box-watcher.swift') != ''
        uses: actions/attest@v4
        with:
          subject-path: drop-box-watcher
      - name: Verify backup-folder attestation
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh attestation verify backup-folder \
              --repo nikolaybotev/backup-folder \
              --signer-workflow nikolaybotev/backup-folder/.github/workflows/release.yml \
              --deny-self-hosted-runners; then
              exit 0
            fi
            sleep 15
          done
          echo "gh attestation verify failed for backup-folder after retries" >&2
          exit 1
      - name: Verify drop-box-watcher attestation
        if: hashFiles('drop-box-watcher.swift') != ''
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh attestation verify drop-box-watcher \
              --repo nikolaybotev/backup-folder \
              --signer-workflow nikolaybotev/backup-folder/.github/workflows/release.yml \
              --deny-self-hosted-runners; then
              exit 0
            fi
            sleep 15
          done
          echo "gh attestation verify failed for drop-box-watcher after retries" >&2
          exit 1
      - name: Prepare release assets
        id: assets
        run: |
          assets=(backup-folder)
          if [[ -f drop-box-watcher ]]; then
            assets+=(drop-box-watcher)
          fi
          {
            echo "files<<EOF"
            printf '%s\n' "${assets[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.assets.outputs.files }}
          generate_release_notes: true
