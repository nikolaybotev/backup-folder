name: release

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: read
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require signing secrets
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_SIGNING_P12_BASE64:-}" ]]; then
            echo "release: missing MACOS_SIGNING_P12_BASE64" >&2
            exit 1
          fi
          if [[ -z "${MACOS_SIGNING_P12_PASSWORD:-}" ]]; then
            echo "release: missing MACOS_SIGNING_P12_PASSWORD" >&2
            exit 1
          fi

      - name: Decide version
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          decision="$(bash scripts/release-version.sh)"
          echo "$decision"
          case "$decision" in
            noop)
              echo "action=noop" >> "$GITHUB_OUTPUT"
              if head_tag="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"; then
                echo "tag=$head_tag" >> "$GITHUB_OUTPUT"
              else
                echo "release: noop without a semver tag on HEAD" >&2
                exit 1
              fi
              ;;
            tag\ v*)
              tag="${decision#tag }"
              echo "action=tag" >> "$GITHUB_OUTPUT"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "release: unexpected release-version output: $decision" >&2
              exit 1
              ;;
          esac

      - name: Skip when release already exists
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.decide.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; nothing to upload."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, sign, and checksum
        id: build
        if: steps.skip.outputs.skip != 'true'
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.decide.outputs.tag }}"
          create_tag="${{ steps.decide.outputs.action }}"

          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "release: runner architecture is not arm64" >&2
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          P12="$RUNNER_TEMP/signing.p12"
          KEYCHAIN_PASS="$(openssl rand -base64 32)"

          restore_keychains() {
            if [[ -n "${OLD_KEYCHAINS:-}" ]]; then
              security list-keychains -d user -s $OLD_KEYCHAINS || true
            fi
          }

          cleanup() {
            security delete-keychain "$KEYCHAIN" 2>/dev/null || true
            rm -f "$P12"
            restore_keychains
          }
          trap cleanup EXIT

          OLD_KEYCHAINS="$(security list-keychains -d user | tr -d '"')"

          printf '%s' "$MACOS_SIGNING_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          if [[ -z "${SIGN_IDENTITY:-}" ]]; then
            SIGN_IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | bash scripts/signing-identity.sh)"
          fi
          if [[ -z "${SIGN_IDENTITY:-}" ]]; then
            echo "release: missing signing identity" >&2
            exit 1
          fi
          export SIGN_IDENTITY
          export VERSION="$tag"
          bash scripts/build.sh

          if [[ -x ./drop-box-watcher/drop-box-watcher ]]; then
            watcher_bin=./drop-box-watcher/drop-box-watcher
          else
            watcher_bin=./drop-box-watcher
          fi

          codesign --verify --strict ./backup-folder
          codesign --verify --strict "$watcher_bin"

          file ./backup-folder | grep -q 'arm64'
          file "$watcher_bin" | grep -q 'arm64'

          shasum -a 256 ./backup-folder "$watcher_bin" > SHA256SUMS

          full_sha="$(git rev-parse HEAD)"
          build_ts="$("./backup-folder" --version --verbose | sed -n 's/.*built \([^)]*\).*/\1/p')"
          if [[ -z "$build_ts" ]]; then
            echo "release: could not read build timestamp from backup-folder --version --verbose" >&2
            exit 1
          fi
          echo "full_sha=$full_sha" >> "$GITHUB_OUTPUT"
          echo "build_ts=$build_ts" >> "$GITHUB_OUTPUT"

      - name: Attest backup-folder
        if: steps.skip.outputs.skip != 'true'
        uses: actions/attest@v4
        with:
          subject-path: backup-folder

      - name: Attest drop-box-watcher
        if: steps.skip.outputs.skip != 'true'
        uses: actions/attest@v4
        with:
          subject-path: drop-box-watcher/drop-box-watcher

      - name: Verify attestations and push tag
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.decide.outputs.tag }}"
          create_tag="${{ steps.decide.outputs.action }}"

          if [[ -x ./drop-box-watcher/drop-box-watcher ]]; then
            watcher_bin=./drop-box-watcher/drop-box-watcher
          else
            watcher_bin=./drop-box-watcher
          fi

          for attempt in 1 2 3 4 5; do
            if gh attestation verify backup-folder \
              --repo "${{ github.repository }}" \
              --signer-workflow "${{ github.repository }}/.github/workflows/release.yml" \
              --deny-self-hosted-runners; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "gh attestation verify failed for backup-folder after retries" >&2
              exit 1
            fi
            sleep 15
          done

          for attempt in 1 2 3 4 5; do
            if gh attestation verify "$watcher_bin" \
              --repo "${{ github.repository }}" \
              --signer-workflow "${{ github.repository }}/.github/workflows/release.yml" \
              --deny-self-hosted-runners; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "gh attestation verify failed for drop-box-watcher after retries" >&2
              exit 1
            fi
            sleep 15
          done

          if [[ "$create_tag" == "tag" ]]; then
            if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
              existing="$(git rev-parse "refs/tags/${tag}^{commit}")"
              head="$(git rev-parse HEAD)"
              if [[ "$existing" != "$head" ]]; then
                echo "release: tag ${tag} already exists on a different commit" >&2
                exit 1
              fi
            else
              git tag "$tag"
              git push origin "refs/tags/${tag}"
            fi
          fi

      - name: Publish GitHub release
        if: steps.skip.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.decide.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            **Build metadata**

            - Commit SHA: `${{ steps.build.outputs.full_sha }}`
            - Built: `${{ steps.build.outputs.build_ts }}`
          files: |
            backup-folder
            drop-box-watcher/drop-box-watcher
            SHA256SUMS
